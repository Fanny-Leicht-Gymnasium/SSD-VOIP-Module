name: Build Docker and TUI and Push Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  set-envs:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      docker_repository: ${{ steps.vars.outputs.docker_repository }}
      branch: ${{ steps.vars.outputs.branch }}
      build_version: ${{ steps.vars.outputs.build_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        shell: bash
        run: |
          OWNER_REPO="${GITHUB_REPOSITORY,,}"
          OWNER="${OWNER_REPO%%/*}"
          REPO="${OWNER_REPO##*/}"
          REPO="${REPO//_/-}"
          IMAGE="ghcr.io/${OWNER}/${REPO}"

          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            BUILD_VERSION="${GITHUB_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            BRANCH="release"
            BUILD_VERSION="${VERSION}"
          else
            BRANCH="unknown"
            BUILD_VERSION="${GITHUB_SHA}"
          fi

          BRANCH="${BRANCH,,}"
          BRANCH="${BRANCH//\//-}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=${BUILD_BRANCH}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"

          echo "image=${IMAGE}:${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "docker_repository=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"


          echo "Image:          ${IMAGE}:${BRANCH}"
          echo "Branch:         ${BRANCH}"
          echo "Version file:   ${BUILD_VERSION}"

  build-bot:
    runs-on: ubuntu-latest
    needs: [set-envs]

    strategy:
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
          - name: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: bot
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg BUILD_VERSION="${{ needs.set-envs.outputs.build_version }}" \
            --build-arg PIPER_MODELS="none" \
            --load \
            -t "${{ needs.set-envs.outputs.docker_repository }}:build-${{ matrix.name }}" \
            .
      - name: Save Docker image
        run: |
          docker save \
            "${{ needs.set-envs.outputs.docker_repository }}:build-${{ matrix.name }}" \
            -o "image-${{ matrix.name }}.tar"
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.name }}
          path: image-${{ matrix.name }}.tar


  push-bot:
    runs-on: ubuntu-latest
    needs: [build-bot, set-envs]

    permissions:
      packages: write

    steps:
      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-amd64
          path: images/amd64

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-arm64
          path: images/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load Docker images
        run: |
          ls -R
          docker load -i images/amd64/image-amd64.tar
          docker load -i images/arm64/image-arm64.tar

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architecture images
        shell: bash
        run: |
          docker tag "${{ needs.set-envs.outputs.docker_repository }}:build-amd64" "${{ needs.set-envs.outputs.image }}-amd64"
          docker tag "${{ needs.set-envs.outputs.docker_repository }}:build-arm64" "${{ needs.set-envs.outputs.image }}-arm64"
          docker push "${{ needs.set-envs.outputs.image }}-amd64"
          docker push "${{ needs.set-envs.outputs.image }}-arm64"

      - name: Create multi-arch image
        shell: bash
        run: |
          docker buildx create --use

          docker buildx imagetools create \
            --tag "${{ needs.set-envs.outputs.image }}" \
            "${{ needs.set-envs.outputs.image }}-amd64" \
            "${{ needs.set-envs.outputs.image }}-arm64"


  build-tui:
    runs-on: ubuntu-latest
    needs: [set-envs]

    strategy:
      matrix:
        include:
          - name: linux-amd64
            goarch: amd64
          - name: linux-arm64
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build TUI
        working-directory: tui
        shell: bash
        run: |
          OWNER_REPO="${GITHUB_REPOSITORY,,}"
          OWNER="${OWNER_REPO%%/*}"
          REPO="${OWNER_REPO##*/}"
          REPO="${REPO//_/-}"

          GIT_REPOSITORY="https://github.com/${OWNER}/${REPO}"
          BUILD_VERSION="${{ needs.set-envs.outputs.build_version }}"
          BUILD_BRANCH="${{ needs.set-envs.outputs.branch }}"

          echo "Repository:    ${GIT_REPOSITORY}"
          echo "Branch:        ${BUILD_BRANCH}"
          echo "Build version: ${BUILD_VERSION}"
          echo "Architecture:  ${{ matrix.goarch }}"
          echo "GOARM:         ${{ matrix.goarm }}"

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=${{ matrix.goarch }} \
          GOARM=${{ matrix.goarm }} \
          go build \
            -ldflags="-s -w \
                      -X main.version=${BUILD_VERSION} \
                      -X main.repository=${GIT_REPOSITORY} \
                      -X main.branch=${BUILD_BRANCH}" \
            -o "ssd-voip-tui-${{ matrix.name }}" \
            .

      - name: Upload TUI
        uses: actions/upload-artifact@v4
        with:
          name: ssd-voip-tui-${{ matrix.name }}
          path: tui/ssd-voip-tui-${{ matrix.name }}

  full-release:
    runs-on: ubuntu-latest
    needs: [set-envs, build-bot, build-tui]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Set version env
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION#v}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "MAJOR=${MAJOR}" >> "$GITHUB_ENV"
          echo "MINOR=${MINOR}" >> "$GITHUB_ENV"

      - name: Download TUI amd64
        uses: actions/download-artifact@v4
        with:
          name: ssd-voip-tui-linux-amd64
          path: tui

      - name: Download TUI arm64
        uses: actions/download-artifact@v4
        with:
          name: ssd-voip-tui-linux-arm64
          path: tui
      - name: Download Docker amd64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-amd64
          path: docker-amd64

      - name: Download Docker arm64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-arm64
          path: docker-arm64
      - name: Load Docker images
        run: |
          docker load -i docker-amd64/image-amd64.tar
          docker load -i docker-arm64/image-arm64.tar
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push Docker images
        shell: bash
        run: |
          IMAGE="${{ needs.set-envs.outputs.docker_repository }}"

          docker tag "${IMAGE}:build-amd64" "${IMAGE}:${VERSION}-amd64"
          docker tag "${IMAGE}:build-arm64" "${IMAGE}:${VERSION}-arm64"

          docker tag "${IMAGE}:build-amd64" "${IMAGE}:v${MAJOR}-amd64"
          docker tag "${IMAGE}:build-arm64" "${IMAGE}:v${MAJOR}-arm64"

          docker tag "${IMAGE}:build-amd64" "${IMAGE}:v${MAJOR}.${MINOR}-amd64"
          docker tag "${IMAGE}:build-arm64" "${IMAGE}:v${MAJOR}.${MINOR}-arm64"

          docker tag "${IMAGE}:build-amd64" "${IMAGE}:latest-amd64"
          docker tag "${IMAGE}:build-arm64" "${IMAGE}:latest-arm64"

          docker push "${IMAGE}:${VERSION}-amd64"
          docker push "${IMAGE}:${VERSION}-arm64"

          docker push "${IMAGE}:v${MAJOR}-amd64"
          docker push "${IMAGE}:v${MAJOR}-arm64"

          docker push "${IMAGE}:v${MAJOR}.${MINOR}-amd64"
          docker push "${IMAGE}:v${MAJOR}.${MINOR}-arm64"

          docker push "${IMAGE}:latest-amd64"
          docker push "${IMAGE}:latest-arm64"

      - name: Create multi-arch release tags
        shell: bash
        run: |
          IMAGE="${{ needs.set-envs.outputs.docker_repository }}"

          docker buildx create --use

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          docker buildx imagetools create \
            --tag "${IMAGE}:v${MAJOR}" \
            "${IMAGE}:v${MAJOR}-amd64" \
            "${IMAGE}:v${MAJOR}-arm64"

          docker buildx imagetools create \
            --tag "${IMAGE}:v${MAJOR}.${MINOR}" \
            "${IMAGE}:v${MAJOR}.${MINOR}-amd64" \
            "${IMAGE}:v${MAJOR}.${MINOR}-arm64"

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

      - name: Generate checksums
        working-directory: tui
        shell: bash
        run: |
          sha256sum \
            ssd-voip-tui-linux-amd64 \
            ssd-voip-tui-linux-arm64 \
            > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: tui
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            ssd-voip-tui-linux-amd64 \
            ssd-voip-tui-linux-arm64 \
            checksums.txt